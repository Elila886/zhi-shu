services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: langgraph_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-test}
      POSTGRES_DB: ${POSTGRES_DATABASE:-langgraph_db}
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DATABASE:-langgraph_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - langgraph_network

  redis:
    image: redis:7.4-alpine
    container_name: langgraph_redis
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - langgraph_network
    restart: on-failure:3

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: runtime
    container_name: langgraph_backend
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - DEEPSEEK_BASE_URL=${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      - TAVILY_API_KEY=${TAVILY_API_KEY}
      - MODEL_PROVIDER=${MODEL_PROVIDER:-openai}
      - MODEL_NAMES=${MODEL_NAMES:-["gpt-4o", "gpt-4o-mini"]}
      - MODEL_BASE_URL=${MODEL_BASE_URL}
      - EMBEDDINGS_MODEL_NAME=${EMBEDDINGS_MODEL_NAME:-text-embedding-3-large}
      - EMBEDDINGS_BASE_URL=${EMBEDDINGS_BASE_URL}
      - HYBRID_DENSE_K=${HYBRID_DENSE_K:-8}
      - HYBRID_BM25_K=${HYBRID_BM25_K:-8}
      - HYBRID_FINAL_K=${HYBRID_FINAL_K:-3}
      - HYBRID_RRF_K=${HYBRID_RRF_K:-60}
      - HYBRID_DENSE_WEIGHT=${HYBRID_DENSE_WEIGHT:-1.0}
      - HYBRID_BM25_WEIGHT=${HYBRID_BM25_WEIGHT:-1.0}
      - TOKEN_BEARER_URL=${TOKEN_BEARER_URL:-/api/v1/auth/login}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_ALGORITHM=${JWT_ALGORITHM:-HS256}
      - ACCESS_TOKEN_EXPIRY_MINS=${ACCESS_TOKEN_EXPIRY_MINS:-60}
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - REFRESH_TOKEN_EXPIRY_DAYS=${REFRESH_TOKEN_EXPIRY_DAYS:-1}
      - FRONTEND_ORIGINS=${FRONTEND_ORIGINS:-["http://localhost:5173","http://localhost:5174","http://localhost:8501","http://localhost:8502"]}
      - COOKIE_SECURE=${COOKIE_SECURE:-false}
      - COOKIE_SAMESITE=${COOKIE_SAMESITE:-lax}
      - REFRESH_COOKIE_NAME=${REFRESH_COOKIE_NAME:-zhishu_refresh}
      - ADMIN_REFRESH_COOKIE_NAME=${ADMIN_REFRESH_COOKIE_NAME:-zhishu_admin_refresh}
      - REDIS_URL=redis://redis:6379/0
      - RATE_LIMIT_KEY_PREFIX=${RATE_LIMIT_KEY_PREFIX:-zhishu:traffic}
      - TRUSTED_PROXY_CIDRS=${TRUSTED_PROXY_CIDRS:-["127.0.0.1/32","::1/128","172.30.0.10/32","172.30.0.11/32","172.30.0.13/32","172.30.0.14/32"]}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-test}
      - POSTGRES_DATABASE=${POSTGRES_DATABASE:-langgraph_db}
      - PGVECTOR_COLLECTION_NAME=${PGVECTOR_COLLECTION_NAME:-my_collection}
      - SUPER_ADMIN_EMAILS=${SUPER_ADMIN_EMAILS:-[]}
    ports:
      - "${BACKEND_HOST_PORT:-8000}:8000"
    volumes:
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - langgraph_network
    restart: on-failure:3

  frontend:
    build:
      context: ./web
      dockerfile: apps/user/Dockerfile
    container_name: langgraph_frontend
    ports:
      - "${FRONTEND_PORT:-8501}:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3
    depends_on:
      backend:
        condition: service_healthy
    networks:
      langgraph_network:
        ipv4_address: 172.30.0.10
    restart: on-failure:3

  admin:
    build:
      context: ./web
      dockerfile: apps/admin/Dockerfile
    container_name: langgraph_admin
    ports:
      - "${ADMIN_PORT:-8502}:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3
    depends_on:
      backend:
        condition: service_healthy
    networks:
      langgraph_network:
        ipv4_address: 172.30.0.11
    restart: on-failure:3

volumes:
  postgres_data:

networks:
  langgraph_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24
